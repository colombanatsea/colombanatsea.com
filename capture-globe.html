<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Globe Capture, Portrait Video</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #080b14; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #fff; }
  #status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 8px; font-size: 16px; z-index: 10; }
  #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; }
  button { background: #2A55B3; color: #fff; border: none; padding: 12px 28px; border-radius: 6px; font-size: 16px; cursor: pointer; }
  button:hover { background: #3566c4; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  canvas { border-radius: 12px; max-height: 80vh; }
</style>
</head>
<body>

<div id="status">Chargement du globe...</div>
<div id="controls">
  <button id="btn-record" disabled>Enregistrer 10s</button>
  <button id="btn-record-20" disabled>Enregistrer 20s</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const WIDTH = 1080;
const HEIGHT = 1920;
const GLOBE_RADIUS = 1.0;
const AUTO_ROTATE_SPEED = 0.35; // faster for video

const status = document.getElementById('status');
const btnRecord = document.getElementById('btn-record');
const btnRecord20 = document.getElementById('btn-record-20');

// --- Scene ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, WIDTH / HEIGHT, 0.01, 100);
camera.position.set(0, 0.25, 2.6);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(WIDTH, HEIGHT);
renderer.setPixelRatio(1);
renderer.setClearColor(0x080b14, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement, document.getElementById('controls'));

// --- Lighting ---
scene.add(new THREE.AmbientLight(0x666666, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 3, 5);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x334455, 0.4);
backLight.position.set(-3, -2, -5);
scene.add(backLight);

// --- Globe ---
const globeGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 96, 96);
const globeMat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 25, bumpScale: 0.015 });
const globe = new THREE.Mesh(globeGeo, globeMat);
scene.add(globe);

// --- Textures ---
const texLoader = new THREE.TextureLoader();
const texturePath = 'site/public/assets/textures/';

texLoader.load(texturePath + 'earth-blue-marble.jpg', (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace;
  globeMat.map = tex;
  globeMat.needsUpdate = true;
});

texLoader.load(texturePath + 'earth-topology.png', (tex) => {
  globeMat.bumpMap = tex;
  globeMat.needsUpdate = true;
});

// --- Atmosphere ---
const atmoVS = `
  varying vec3 vNormal;
  void main() {
    vNormal = normalize(normalMatrix * normal);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const atmoFS = `
  varying vec3 vNormal;
  void main() {
    float i = pow(0.65 - dot(vNormal, vec3(0,0,1)), 3.0);
    gl_FragColor = vec4(0.15, 0.55, 0.7, 1) * i * 0.7;
  }
`;
const atmoMat = new THREE.ShaderMaterial({
  vertexShader: atmoVS,
  fragmentShader: atmoFS,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false
});
const atmo = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_RADIUS * 1.12, 64, 64), atmoMat);
scene.add(atmo);

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.5;
controls.enableZoom = true;
controls.zoomSpeed = 0.8;
controls.minDistance = 1.3;
controls.maxDistance = 5;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = AUTO_ROTATE_SPEED;

// --- Animation ---
let ready = false;
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Wait for textures to load
setTimeout(() => {
  ready = true;
  status.textContent = 'Globe prêt, cliquez pour enregistrer';
  btnRecord.disabled = false;
  btnRecord20.disabled = false;
}, 2000);

// --- Recording ---
function startRecording(durationSec) {
  const canvas = renderer.domElement;
  const stream = canvas.captureStream(30); // 30 FPS
  const chunks = [];

  // Try VP9 first, fallback to VP8, then default
  let mimeType = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/webm;codecs=vp8';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'video/webm';
    }
  }

  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });

  recorder.ondataavailable = (e) => {
    if (e.data.size > 0) chunks.push(e.data);
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `globe-portrait-${durationSec}s.webm`;
    a.click();
    URL.revokeObjectURL(url);
    status.textContent = 'Vidéo téléchargée !';
    btnRecord.disabled = false;
    btnRecord20.disabled = false;
  };

  // Boost rotation speed during recording
  controls.autoRotateSpeed = AUTO_ROTATE_SPEED;

  recorder.start();
  btnRecord.disabled = true;
  btnRecord20.disabled = true;

  let elapsed = 0;
  const interval = setInterval(() => {
    elapsed++;
    status.textContent = `Enregistrement... ${elapsed}/${durationSec}s`;
    if (elapsed >= durationSec) {
      clearInterval(interval);
      recorder.stop();
    }
  }, 1000);

  status.textContent = `Enregistrement... 0/${durationSec}s`;
}

btnRecord.addEventListener('click', () => startRecording(10));
btnRecord20.addEventListener('click', () => startRecording(20));

</script>
</body>
</html>
