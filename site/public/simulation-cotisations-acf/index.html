<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulateur de Cotisations ACF, GASPE</title>
<meta name="description" content="Outil interactif de simulation des cotisations ACF (Armateurs Côtiers Français) avec 3 composantes : services, lobbying, dialogue social CCN 3228.">
<meta property="og:title" content="Simulateur de Cotisations ACF, GASPE">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="lib/react.min.js"></script>
<script src="lib/react-dom.min.js"></script>
<style>
html,body{margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;background:#f7f8fa}
body{border-top:3px solid;border-image:linear-gradient(90deg,#0F4761,#1B9AAA) 1}
*{box-sizing:border-box}
input[type=number]{-moz-appearance:textfield}

input[type=range]::-webkit-slider-track{height:6px;border-radius:3px;background:#e2e8f0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;margin-top:-5px;cursor:pointer}
</style>
</head>
