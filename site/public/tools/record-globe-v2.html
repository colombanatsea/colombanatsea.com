<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Globe — Export Vidéo Instagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 { font-size: 1.4rem; font-weight: 300; margin-bottom: 0.5rem; color: rgba(255,255,255,0.8); }
  .subtitle { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-bottom: 2rem; }
  .controls {
    display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; justify-content: center;
  }
  button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 0.8rem 1.6rem;
    color: #fff;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.recording { border-color: #ff4444; background: rgba(255,0,0,0.15); }
  .format-label { font-size: 0.65rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 0.3rem; }
  .format-size { font-size: 0.7rem; color: rgba(255,255,255,0.3); }
  #status {
    font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 1rem;
    min-height: 1.2em; text-align: center;
  }
  #progress-bar {
    width: 300px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px;
    margin-bottom: 1.5rem; overflow: hidden;
  }
  #progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #2A55B3, #00BF63); transition: width 0.1s; }
  .canvas-wrap {
    border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  canvas { display: block; }
</style>
</head>
<body>

<h1>Export vidéo du Globe</h1>
<p class="subtitle">3 rotations complètes — ZEE, câbles sous-marins, routes maritimes</p>

<div class="controls">
  <button id="btn-square" onclick="startRecording('square')">
    <span class="format-label">Post Instagram</span>
    Carré 1080×1080
    <span class="format-size">~18s · MP4/WebM</span>
  </button>
  <button id="btn-portrait" onclick="startRecording('portrait')">
    <span class="format-label">Story Instagram</span>
    Portrait 1080×1920
    <span class="format-size">~18s · MP4/WebM</span>
  </button>
</div>

<div id="status">Chargement du globe...</div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<div class="canvas-wrap"><canvas id="globe-canvas"></canvas></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "earcut": "https://cdn.jsdelivr.net/npm/earcut@3.0.2/+esm"
  }
}
</script>

<script type="module">
/* v7 — fix resizeRenderer destroying WebGL context */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import earcut from 'earcut';

// ── CONFIG ──
const GLOBE_RADIUS = 1.0;
const ZEE_HEIGHT = 1.003;
const CABLE_RADIUS = GLOBE_RADIUS + 0.005;
const LANE_RADIUS = GLOBE_RADIUS + 0.003;
const SPHERE_SEG = 96;
const ROTATIONS = 3;
const ROTATION_DURATION = 18; // seconds for 3 rotations
const FPS = 30;

const statusEl = document.getElementById('status');
const progressFill = document.getElementById('progress-fill');
const canvas = document.getElementById('globe-canvas');

// Default preview size (square)
let currentW = 540;
let currentH = 540;
canvas.width = currentW;
canvas.height = currentH;

// ── LOAD DATA ──
statusEl.textContent = 'Chargement des données...';
const [EEZ_GEOJSON, CABLE_GEOJSON, SHIPPING_LANES] = await Promise.all([
  fetch('/tools/eez.json').then(r => r.json()),
  fetch('/tools/cables.json').then(r => r.json()),
  fetch('/tools/shipping-lanes.json').then(r => r.json()),
]);

// ── THREE.JS SETUP ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, currentW / currentH, 0.01, 100);
camera.position.set(2.8, 0.4, 0);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
  preserveDrawingBuffer: true
});
renderer.setSize(currentW, currentH);
renderer.setPixelRatio(1); // will be set to 2 during recording
renderer.setClearColor(0x080b14, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.5;
controls.enableZoom = true;
controls.zoomSpeed = 0.8;
controls.minDistance = 1.3;
controls.maxDistance = 5;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// ── LIGHTING ──
scene.add(new THREE.AmbientLight(0x666666, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 3, 5);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x334455, 0.4);
backLight.position.set(-3, -2, -5);
scene.add(backLight);

// ── GLOBE ──
const textureLoader = new THREE.TextureLoader();
const globeGeo = new THREE.SphereGeometry(GLOBE_RADIUS, SPHERE_SEG, SPHERE_SEG);
const globeMat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 25, bumpScale: 0.015 });
const globe = new THREE.Mesh(globeGeo, globeMat);
scene.add(globe);

statusEl.textContent = 'Chargement des textures...';

await new Promise((resolve) => {
  let loaded = 0;
  const check = () => { loaded++; if (loaded >= 2) resolve(undefined); };
  textureLoader.load('/assets/textures/earth-blue-marble.jpg', (t) => {
    t.colorSpace = THREE.SRGBColorSpace;
    globeMat.map = t;
    globeMat.needsUpdate = true;
    check();
  }, undefined, check);
  textureLoader.load('/assets/textures/earth-topology.png', (t) => {
    globeMat.bumpMap = t;
    globeMat.needsUpdate = true;
    check();
  }, undefined, check);
});

// ── ATMOSPHERE ──
const atmoVS = `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const atmoFS = `varying vec3 vNormal; void main() { float i = pow(0.65 - dot(vNormal, vec3(0,0,1)), 3.0); gl_FragColor = vec4(0.15,0.55,0.7,1) * i * 0.7; }`;
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_RADIUS * 1.12, 64, 64),
  new THREE.ShaderMaterial({ vertexShader: atmoVS, fragmentShader: atmoFS, blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent: true, depthWrite: false })
));

// ── UTILITY ──
function latLonToVec3(lat, lon, r) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = -lon * Math.PI / 180;
  return new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}

function interpolateGreatCircle(lat1, lon1, lat2, lon2, r, maxGapDeg) {
  const dLat = lat2 - lat1, dLon = lon2 - lon1;
  const gap = Math.sqrt(dLat * dLat + dLon * dLon);
  if (gap <= maxGapDeg) return [latLonToVec3(lat2, lon2, r)];
  const steps = Math.ceil(gap / maxGapDeg);
  const pts = [];
  for (let s = 1; s <= steps; s++) {
    const t = s / steps;
    pts.push(latLonToVec3(lat1 + dLat * t, lon1 + dLon * t, r));
  }
  return pts;
}

// ── ZEE ──
const zoneGroup = new THREE.Group();
scene.add(zoneGroup);

function normalizeLon(ring) {
  let maxJump = 0;
  for (let i = 1; i < ring.length; i++) maxJump = Math.max(maxJump, Math.abs(ring[i][0] - ring[i - 1][0]));
  if (maxJump <= 180) return ring;
  return ring.map(p => [p[0] < 0 ? p[0] + 360 : p[0], p[1]]);
}

function createZeeMesh(outerPts, holePtsArray, properties) {
  const flat = [];
  for (const pt of outerPts) flat.push(pt[0], pt[1]);
  const holeIndices = [];
  if (holePtsArray) {
    for (const hole of holePtsArray) {
      if (hole.length < 3) continue;
      holeIndices.push(flat.length / 2);
      for (const pt of hole) flat.push(pt[0], pt[1]);
    }
  }
  let triIndices;
  try { triIndices = earcut(flat, holeIndices.length > 0 ? holeIndices : undefined, 2); }
  catch { return null; }
  if (!triIndices || triIndices.length === 0) return null;

  const MAX_ARC_DEG = 3;
  const outVerts = [];
  const outIdx = [];
  const vertMap = new Map();

  function addVert(lo, la) {
    const key = lo.toFixed(4) + ',' + la.toFixed(4);
    if (vertMap.has(key)) return vertMap.get(key);
    let lon2 = lo; if (lon2 > 180) lon2 -= 360;
    const v = latLonToVec3(la, lon2, ZEE_HEIGHT);
    const idx = outVerts.length / 3;
    outVerts.push(v.x, v.y, v.z);
    vertMap.set(key, idx);
    return idx;
  }

  function subdivideTri(a, b, c, depth) {
    const dAB = Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2);
    const dBC = Math.sqrt((b[0]-c[0])**2 + (b[1]-c[1])**2);
    const dCA = Math.sqrt((c[0]-a[0])**2 + (c[1]-a[1])**2);
    if (Math.max(dAB, dBC, dCA) <= MAX_ARC_DEG || depth > 5) {
      outIdx.push(addVert(a[0], a[1]), addVert(b[0], b[1]), addVert(c[0], c[1]));
      return;
    }
    const mAB = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    const mBC = [(b[0]+c[0])/2, (b[1]+c[1])/2];
    const mCA = [(c[0]+a[0])/2, (c[1]+a[1])/2];
    subdivideTri(a, mAB, mCA, depth+1);
    subdivideTri(mAB, b, mBC, depth+1);
    subdivideTri(mCA, mBC, c, depth+1);
    subdivideTri(mAB, mBC, mCA, depth+1);
  }

  for (let i = 0; i < triIndices.length; i += 3) {
    const iA = triIndices[i], iB = triIndices[i+1], iC = triIndices[i+2];
    subdivideTri([flat[iA*2], flat[iA*2+1]], [flat[iB*2], flat[iB*2+1]], [flat[iC*2], flat[iC*2+1]], 0);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(outVerts), 3));
  geo.setIndex(outIdx);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color: 0x00b4b4, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false
  }));
  mesh.renderOrder = 1;
  zoneGroup.add(mesh);

  // Border
  const borderPts = [];
  for (const pt of outerPts) {
    let lon = pt[0]; if (lon > 180) lon -= 360;
    borderPts.push(latLonToVec3(pt[1], lon, ZEE_HEIGHT * 1.0005));
  }
  if (borderPts.length > 2) borderPts.push(borderPts[0].clone());
  if (borderPts.length >= 2) {
    const borderLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(borderPts),
      new THREE.LineBasicMaterial({ color: 0x00e0e0, transparent: true, opacity: 0.55 })
    );
    borderLine.renderOrder = 2;
    zoneGroup.add(borderLine);
  }
}

function processEEZ(geojson) {
  if (!geojson || !geojson.features) return;
  for (const feature of geojson.features) {
    const geom = feature.geometry;
    const props = feature.properties || {};
    if (!geom) continue;
    const coordsList = [];
    if (geom.type === 'Polygon') coordsList.push(geom.coordinates);
    else if (geom.type === 'MultiPolygon') for (const poly of geom.coordinates) coordsList.push(poly);
    for (const coords of coordsList) {
      const outer = coords[0];
      if (!outer || outer.length < 3) continue;
      const normOuter = normalizeLon(outer);
      const holes = [];
      for (let h = 1; h < coords.length; h++) {
        if (coords[h] && coords[h].length >= 3) holes.push(normalizeLon(coords[h]));
      }
      createZeeMesh(normOuter, holes, props);
    }
  }
}
processEEZ(EEZ_GEOJSON);

// ── STARFIELD ──
const starPos = new Float32Array(2000 * 3);
for (let i = 0; i < 2000; i++) {
  const r = 15 + Math.random() * 35;
  const t = Math.random() * Math.PI * 2;
  const p = Math.acos(2 * Math.random() - 1);
  starPos[i*3] = r * Math.sin(p) * Math.cos(t);
  starPos[i*3+1] = r * Math.sin(p) * Math.sin(t);
  starPos[i*3+2] = r * Math.cos(p);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaabbdd, size: 0.04, transparent: true, opacity: 0.6, sizeAttenuation: true, depthWrite: false })));

// ── CABLES ──
const cableGroup = new THREE.Group();
scene.add(cableGroup);

function splitCableCoords(coords) {
  const segments = [];
  let current = [];
  for (let i = 0; i < coords.length; i++) {
    const lon = coords[i][0], lat = coords[i][1];
    if (isNaN(lat) || isNaN(lon)) continue;
    if (current.length > 0) {
      const prevLon = current[current.length - 1][0];
      if (Math.abs(lon - prevLon) > 90) {
        const lon1 = current[current.length - 1][0], lat1 = current[current.length - 1][1];
        let lon2 = lon;
        if (lon2 - lon1 > 180) lon2 -= 360;
        else if (lon1 - lon2 > 180) lon2 += 360;
        const crossLon = lon1 > 0 ? 180 : -180;
        const t = (lon2 - lon1) !== 0 ? (crossLon - lon1) / (lon2 - lon1) : 0.5;
        const crossLat = lat1 + t * (lat - lat1);
        current.push([crossLon, crossLat]);
        if (current.length >= 2) segments.push(current);
        current = [[-crossLon, crossLat], [lon, lat]];
        continue;
      }
    }
    current.push([lon, lat]);
  }
  if (current.length >= 2) segments.push(current);
  return segments;
}

function processCables(geojson) {
  if (!geojson || !geojson.features) return;
  for (const feature of geojson.features) {
    const geom = feature.geometry;
    if (!geom) continue;
    const colorVal = feature.properties && feature.properties.c;
    let cableColor;
    try { cableColor = new THREE.Color(colorVal || '#00b4b4'); }
    catch { cableColor = new THREE.Color(0x00b4b4); }
    const coordSets = [];
    if (geom.type === 'MultiLineString') coordSets.push(...geom.coordinates);
    else if (geom.type === 'LineString') coordSets.push(geom.coordinates);
    for (const coords of coordSets) {
      for (const seg of splitCableCoords(coords)) {
        const pts = [];
        for (let i = 0; i < seg.length; i++) {
          const lon = seg[i][0], lat = seg[i][1];
          if (pts.length === 0) { pts.push(latLonToVec3(lat, lon, CABLE_RADIUS)); }
          else {
            const prevLon = seg[i-1][0], prevLat = seg[i-1][1];
            pts.push(...interpolateGreatCircle(prevLat, prevLon, lat, lon, CABLE_RADIUS, 5));
          }
        }
        if (pts.length < 2) continue;
        cableGroup.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(pts),
          new THREE.LineBasicMaterial({ color: cableColor, transparent: true, opacity: 0.35, depthWrite: false })
        ));
      }
    }
  }
}
processCables(CABLE_GEOJSON);

// ── SHIPPING LANES ──
const trafficGroup = new THREE.Group();
scene.add(trafficGroup);
const LANE_STYLES = { 1: { color: 0xff8c50, opacity: 0.90 }, 2: { color: 0xff7040, opacity: 0.60 }, 3: { color: 0xff6432, opacity: 0.32 } };

SHIPPING_LANES.features.forEach((feat) => {
  const style = LANE_STYLES[feat.properties.t];
  if (!style) return;
  const mat = new THREE.LineBasicMaterial({ color: style.color, transparent: true, opacity: style.opacity, depthWrite: false });
  feat.geometry.coordinates.forEach((line) => {
    const points = [];
    for (let i = 0; i < line.length; i++) {
      const lon = line[i][0], lat = line[i][1];
      if (isNaN(lat) || isNaN(lon)) continue;
      if (points.length === 0) { points.push(latLonToVec3(lat, lon, LANE_RADIUS)); }
      else {
        const prevLon = line[i-1][0], prevLat = line[i-1][1];
        points.push(...interpolateGreatCircle(prevLat, prevLon, lat, lon, LANE_RADIUS, 5));
      }
    }
    if (points.length >= 2) trafficGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), mat));
  });
});

// ── ZEE PULSE ANIMATION ──
let fc = 0;

// ── PREVIEW ANIMATION ──
function animatePreview() {
  requestAnimationFrame(animatePreview);
  if (isRecording) return; // Skip preview loop during recording
  fc++;
  controls.update();
  // ZEE pulse
  if (fc % 2 === 0) {
    const pulse = 0.18 + Math.sin(fc * 0.015) * 0.04;
    zoneGroup.children.forEach(child => {
      if (child.isMesh && child.material) child.material.opacity = pulse;
    });
  }
  renderer.render(scene, camera);
}

statusEl.textContent = 'Globe prêt — choisissez un format';
animatePreview();

// ── RECORDING ──
let isRecording = false;

function resizeRenderer(w, h) {
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

window.startRecording = async function(format) {
  console.log('=== startRecording v8 ===', format);
  try {
  if (isRecording) return;
  isRecording = true;

  const btnSquare = document.getElementById('btn-square');
  const btnPortrait = document.getElementById('btn-portrait');
  btnSquare.disabled = true;
  btnPortrait.disabled = true;

  const recordW = 1080;
  const recordH = format === 'square' ? 1080 : 1920;
  const label = format === 'square' ? 'carré' : 'portrait';

  statusEl.textContent = `Préparation de l'enregistrement ${label}...`;
  progressFill.style.width = '0%';

  console.log('[v8] step 1: resize');
  resizeRenderer(recordW, recordH);
  renderer.setPixelRatio(1);

  console.log('[v8] step 2: reset camera');
  camera.position.set(2.8, 0.4, 0);
  camera.lookAt(0, 0, 0);
  controls.update();

  console.log('[v8] step 3: safety render');
  renderer.render(scene, camera);
  await new Promise(r => setTimeout(r, 300));

  console.log('[v8] step 4: check context');
  const gl = renderer.getContext();
  if (!gl || gl.isContextLost()) {
    throw new Error('WebGL context lost after resize');
  }

  const totalFrames = FPS * ROTATION_DURATION;
  const startAzimuth = controls.getAzimuthalAngle();
  const polar = controls.getPolarAngle();
  const dist = camera.position.length();

  controls.autoRotate = false;
  controls.enabled = false;

  console.log('[v8] step 5: captureStream');
  const stream = canvas.captureStream(0);

  console.log('[v8] step 6: MediaRecorder');
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm;codecs=vp8';

  const recorder = new MediaRecorder(stream, {
    mimeType,
    videoBitsPerSecond: 8_000_000
  });

  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

  const recordingDone = new Promise(resolve => {
    recorder.onstop = () => resolve(undefined);
  });

  console.log('[v8] step 7: recorder.start()');
  recorder.start();
  statusEl.textContent = `Enregistrement ${label} en cours...`;

  console.log('[v8] step 8: frame loop, totalFrames:', totalFrames);
  let frameIndex = 0;
  await new Promise((resolveLoop) => {
    function recordFrame() {
      try {
        if (frameIndex >= totalFrames) {
          resolveLoop();
          return;
        }

        const progress = frameIndex / totalFrames;
        const angle = startAzimuth + progress * Math.PI * 2 * ROTATIONS;

        camera.position.x = dist * Math.sin(polar) * Math.sin(angle);
        camera.position.z = dist * Math.sin(polar) * Math.cos(angle);
        camera.position.y = dist * Math.cos(polar);
        camera.lookAt(0, 0, 0);

        const pulse = 0.18 + Math.sin(frameIndex * 0.3) * 0.04;
        zoneGroup.children.forEach(child => {
          if (child.isMesh && child.material) child.material.opacity = pulse;
        });

        renderer.render(scene, camera);

        const track = stream.getVideoTracks()[0];
        if (track && track.requestFrame) {
          track.requestFrame();
        }

        const pct = Math.round((frameIndex + 1) / totalFrames * 100);
        progressFill.style.width = pct + '%';
        statusEl.textContent = `Enregistrement ${label} — ${pct}%`;

        if (frameIndex === 0) console.log('[v8] first frame OK');

        frameIndex++;
        requestAnimationFrame(recordFrame);
      } catch(err) {
        console.error('[v8] recordFrame error at frame', frameIndex, err);
        resolveLoop();
      }
    }
    requestAnimationFrame(recordFrame);
  });

  console.log('[v8] step 9: stop recorder');
  recorder.stop();
  await recordingDone;

  statusEl.textContent = 'Préparation du téléchargement...';

  const blob = new Blob(chunks, { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `globe-colomban-${format}.webm`;
  a.click();
  URL.revokeObjectURL(url);

  statusEl.textContent = `Téléchargement ${label} terminé ! Vous pouvez exporter l'autre format.`;
  progressFill.style.width = '100%';

  resizeRenderer(currentW, currentH);
  renderer.setPixelRatio(1);
  camera.position.set(2.8, 0.4, 0);
  camera.lookAt(0, 0, 0);
  controls.enabled = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.3;

  isRecording = false;
  btnSquare.disabled = false;
  btnPortrait.disabled = false;
  } catch(err) {
    console.error('[v8] startRecording ERROR:', err, err.stack);
    statusEl.textContent = `Erreur: ${err.message}`;
    isRecording = false;
    const btnSquare = document.getElementById('btn-square');
    const btnPortrait = document.getElementById('btn-portrait');
    if (btnSquare) btnSquare.disabled = false;
    if (btnPortrait) btnPortrait.disabled = false;
  }
};
</script>

</body>
</html>
